<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 100" fill="none">
  <!-- Text: "washud" + dotless-i + "wa" in Inter Light, tracking 0.18em -->
  <text
    x="10"
    y="80"
    font-family="Inter, sans-serif"
    font-weight="300"
    font-size="48"
    letter-spacing="8.64"
    fill="white"
  >washud1wa</text>

  <!--
    Venn-eye mark above the "i" stem.
    Position is approximate  adjust in Figma to center
    over the dotless-i character.
  -->
  <g id="venn-eye" transform="translate(201, 27) scale(0.576)">
    <!-- Green eye / intersection -->
    <path
      d="M50,10.6 A23,23 0 0,1 50,45.4 A23,23 0 0,1 50,10.6Z"
      fill="#4ADE80"
    />
    <!-- Left circle -->
    <circle cx="35" cy="28" r="23" stroke="white" stroke-width="2.6" fill="none"/>
    <!-- Right circle -->
    <circle cx="65" cy="28" r="23" stroke="white" stroke-width="2.6" fill="none"/>
    <!-- Pupil -->
    <circle cx="50" cy="28" r="5" fill="#111118"/>
  </g>
</svg>
